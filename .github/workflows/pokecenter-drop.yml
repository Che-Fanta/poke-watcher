name: pokecenter-drop

# Drop-Modus: EIN langer Job, der ~jede Minute pokemoncenter.com prüft.
# Achtung: GitHub-Cron startet oft Stunden zu spät -> am Drop-Tag lieber
# manuell per "Run workflow" starten. Der Job läuft bis "until" (UTC).
# Sommerzeit: 18:15 UTC = 20:15 Schweizer Zeit.

on:
  schedule:
    - cron: "30 12 30 9 *"   # 30.9. 12:30 UTC (Backup, falls niemand manuell startet)
  workflow_dispatch:
    inputs:
      until:
        description: "Bis wann prüfen (UTC, HH:MM) – 18:15 UTC = 20:15 CH"
        default: "18:15"
      interval:
        description: "Sekunden zwischen den Prüfungen"
        default: "75"

permissions:
  contents: write

concurrency:
  group: pokecenter-drop
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run Pokémon Center watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python pokecenter_watcher.py \
            --until "${{ github.event.inputs.until || '18:15' }}" \
            --interval "${{ github.event.inputs.interval || '75' }}"

      - name: Persist state
        if: always()
        run: |
          if [ -n "$(git status --porcelain pc_state.json)" ]; then
            git config user.name "poke-watcher-bot"
            git config user.email "bot@users.noreply.github.com"
            git add pc_state.json
            git commit -m "update pokecenter state [skip ci]"
            git pull --rebase
            git push
          else
            echo "kei Ändrig am state"
          fi
